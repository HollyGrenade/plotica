name: Plotica derleme

# macOS (.dmg) ve Windows (.exe/.msi) kurulum dosyalarini uretir.
# Calistirma: GitHub'da Actions sekmesi -> "Plotica derleme" -> Run workflow
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/M4)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: 'macOS-AppleSilicon'
          # Intel Mac
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: 'macOS-Intel'
          - platform: windows-latest
            args: '--bundles nsis'
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust onbellegi
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Uygulamayi derle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Plotica ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Ciktilari yukle
        uses: actions/upload-artifact@v5
        with:
          name: Plotica-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish signed update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
